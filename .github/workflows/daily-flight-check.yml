name: Daily flight check

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC. Change to suit your time zone.
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write           # to commit the updated price history

concurrency:
  group: flight-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search flights and send Telegram alert
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m flight_tracker.main

      - name: Save price history
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update flight price history"
          # trips.yaml may have been edited from the trip page while this ran
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
