<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6;
    --accent: #2457d6; --accent-text: #ffffff; --danger: #b42318; --ok: #1a7f37; --warn-bg: #fff6db;
    --input: #ffffff; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1e24; --text: #e8eaed; --muted: #9aa3ad; --line: #2e343c;
      --accent: #6d9bff; --accent-text: #0d1117; --danger: #ff7b72; --ok: #56d364; --warn-bg: #3a3014;
      --input: #12161b; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-head input { font-weight: 600; font-size: 16px; flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 560px) { .grid, .grid.three { grid-template-columns: 1fr 1fr; } }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 9px 10px; font: inherit; color: var(--text);
                  background: var(--input); border: 1px solid var(--line); border-radius: 8px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; min-height: 16px; }
  .row { margin-top: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--text); padding: 7px 12px; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 9px 14px;
           border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.link { border: 0; background: none; color: var(--danger); padding: 6px 8px; }
  button:disabled { opacity: .6; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0; }
  .muted { color: var(--muted); }
  .status { font-size: 14px; }
  .status.ok { color: var(--ok); } .status.err { color: var(--danger); }
  .budget { background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: none; }
  .settings { display: flex; gap: 12px; flex-wrap: wrap; }
  .settings > div { min-width: 140px; }
  #result { white-space: pre-wrap; }
  #result a { color: var(--accent); }
  .pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px;
          background: var(--warn-bg); margin-left: 6px; }
</style>
</head>
<body>
<main>
  <h1>✈️ Flight Tracker</h1>
  <p class="sub">Add your trips. Every day you'll get a Telegram message with the cheapest flight for each one.</p>

  <div id="trips"></div>
  <button id="add">+ Add a trip</button>

  <div class="card row">
    <div class="settings">
      <div><label for="currency">Currency</label>
        <select id="currency">
          <option>USD</option><option>INR</option><option>EUR</option><option>GBP</option>
          <option>CAD</option><option>AUD</option><option>SGD</option><option>AED</option>
        </select></div>
      <div><label for="budget">Searches per day</label>
        <input id="budget" type="number" min="1" max="50" value="3"></div>
    </div>
    <div class="hint">The SerpApi free plan allows about 3 searches a day. Each departure and return date pair is one search.</div>
    <div id="budget-note" class="budget row"></div>
  </div>

  <div class="actions">
    <button class="primary" id="save">Save trips</button>
    <button id="check">Check prices now</button>
    <span id="status" class="status"></span>
  </div>

  <div id="result-card" class="card" hidden>
    <strong>Preview of your alert</strong><span id="mock-pill" class="pill" hidden>sample prices: no SerpApi key set</span>
    <div id="result" class="row"></div>
  </div>
</main>

<datalist id="cities">
  <option value="JFK,EWR,LGA">New York (all airports)</option>
  <option value="LAX">Los Angeles</option>
  <option value="SFO,OAK,SJC">San Francisco Bay Area</option>
  <option value="ORD,MDW">Chicago</option>
  <option value="IAD,DCA,BWI">Washington DC</option>
  <option value="BOS">Boston</option>
  <option value="SEA">Seattle</option>
  <option value="DFW,DAL">Dallas</option>
  <option value="IAH,HOU">Houston</option>
  <option value="ATL">Atlanta</option>
  <option value="MIA,FLL">Miami</option>
  <option value="YYZ">Toronto</option>
  <option value="YVR">Vancouver</option>
  <option value="LHR,LGW,STN">London</option>
  <option value="CDG,ORY">Paris</option>
  <option value="FRA">Frankfurt</option>
  <option value="AMS">Amsterdam</option>
  <option value="DXB">Dubai</option>
  <option value="DOH">Doha</option>
  <option value="DEL">Delhi</option>
  <option value="BOM">Mumbai</option>
  <option value="BLR">Bengaluru</option>
  <option value="HYD">Hyderabad</option>
  <option value="MAA">Chennai</option>
  <option value="CCU">Kolkata</option>
  <option value="PNQ">Pune</option>
  <option value="AMD">Ahmedabad</option>
  <option value="NAG">Nagpur</option>
  <option value="GOI,GOX">Goa</option>
  <option value="COK">Kochi</option>
  <option value="SIN">Singapore</option>
  <option value="BKK">Bangkok</option>
  <option value="KUL">Kuala Lumpur</option>
  <option value="HKG">Hong Kong</option>
  <option value="NRT,HND">Tokyo</option>
  <option value="ICN">Seoul</option>
  <option value="SYD">Sydney</option>
  <option value="MEL">Melbourne</option>
</datalist>

<script>
const CITY = {};
document.querySelectorAll('#cities option').forEach(o => CITY[o.value] = o.textContent);
const $ = s => document.querySelector(s);
let state = { trips: [], currency: 'USD', max_searches_per_run: 3 };

const blank = () => ({ name: '', origin: '', destination: '', depart_from: '', depart_to: '',
  trip_type: 'round', return_mode: 'dates', return_from: '', return_to: '', length_days: '',
  adults: 1, children: 0, cabin: 'economy', max_stops: '1', target_price: '' });

const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const days = (a, b) => (!a ? 0 : !b || b <= a ? 1 : Math.round((new Date(b) - new Date(a)) / 864e5) + 1);
const combos = t => {
  const d = days(t.depart_from, t.depart_to);
  if (t.trip_type === 'oneway') return d;
  if (t.return_mode === 'length') return d * (String(t.length_days).split(',').filter(x => x.trim()).length || 0);
  return d * days(t.return_from, t.return_to);
};
const cityHint = code => CITY[String(code).toUpperCase()] || (code ? 'Airport code, e.g. JFK' : 'Type a city or 3-letter airport code');

function field(i, key, label, attrs = '') {
  const v = state.trips[i][key];
  return `<div><label for="f${i}${key}">${label}</label>
    <input id="f${i}${key}" data-i="${i}" data-k="${key}" value="${esc(v)}" ${attrs}></div>`;
}

function render() {
  $('#trips').innerHTML = state.trips.map((t, i) => {
    const round = t.trip_type === 'round', byLen = t.return_mode === 'length';
    return `<section class="card">
      <div class="card-head">
        <input data-i="${i}" data-k="name" value="${esc(t.name)}" placeholder="Trip name (e.g. Diwali home trip)" aria-label="Trip name">
        <button class="link" data-del="${i}">Remove</button>
      </div>
      <div class="grid">
        <div><label for="f${i}origin">From</label>
          <input id="f${i}origin" list="cities" data-i="${i}" data-k="origin" value="${esc(t.origin)}" placeholder="City or airport">
          <div class="hint">${esc(cityHint(t.origin))}</div></div>
        <div><label for="f${i}destination">To</label>
          <input id="f${i}destination" list="cities" data-i="${i}" data-k="destination" value="${esc(t.destination)}" placeholder="City or airport">
          <div class="hint">${esc(cityHint(t.destination))}</div></div>
      </div>
      <div class="row seg" role="group" aria-label="Trip type">
        <button data-i="${i}" data-set="trip_type" data-v="round" class="${round ? 'on' : ''}">Round trip</button>
        <button data-i="${i}" data-set="trip_type" data-v="oneway" class="${round ? '' : 'on'}">One-way</button>
      </div>
      <div class="grid row">
        ${field(i, 'depart_from', 'Depart on', 'type="date"')}
        ${field(i, 'depart_to', 'Flexible until (optional)', 'type="date"')}
      </div>
      ${round ? `
      <div class="row seg" role="group" aria-label="Return by">
        <button data-i="${i}" data-set="return_mode" data-v="dates" class="${byLen ? '' : 'on'}">Return date</button>
        <button data-i="${i}" data-set="return_mode" data-v="length" class="${byLen ? 'on' : ''}">Days away</button>
      </div>
      <div class="grid row">
        ${byLen ? field(i, 'length_days', 'Days away (e.g. 10 or 10, 14)', 'inputmode="numeric"') :
          field(i, 'return_from', 'Return on', 'type="date"') + field(i, 'return_to', 'Flexible until (optional)', 'type="date"')}
      </div>` : ''}
      <div class="grid three row">
        ${field(i, 'adults', 'Adults', 'type="number" min="1" max="9"')}
        ${field(i, 'children', 'Children (2–11)', 'type="number" min="0" max="8"')}
        <div><label for="f${i}cabin">Cabin</label>
          <select id="f${i}cabin" data-i="${i}" data-k="cabin">
            ${[['economy','Economy'],['premium_economy','Premium economy'],['business','Business'],['first','First']]
              .map(([v, l]) => `<option value="${v}" ${t.cabin === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select></div>
        <div><label for="f${i}max_stops">Stops</label>
          <select id="f${i}max_stops" data-i="${i}" data-k="max_stops">
            ${[['','Any'],['0','Nonstop only'],['1','Up to 1 stop'],['2','Up to 2 stops']]
              .map(([v, l]) => `<option value="${v}" ${String(t.max_stops) === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select></div>
        ${field(i, 'target_price', 'Alert me below (optional)', 'type="number" min="0" placeholder="e.g. 900"')}
      </div>
      <div class="hint row">${combos(t)} date combination${combos(t) === 1 ? '' : 's'}</div>
    </section>`;
  }).join('') || '<p class="muted">No trips yet. Add one below.</p>';
  updateBudget();
}

function updateBudget() {
  const total = state.trips.reduce((n, t) => n + combos(t), 0);
  const per = Number($('#budget').value) || 3;
  const note = $('#budget-note');
  if (total > per) {
    note.style.display = 'block';
    note.textContent = `Your trips have ${total} date combinations. At ${per} a day, the tracker checks a different set each day and covers all of them every ${Math.ceil(total / per)} days.`;
  } else note.style.display = 'none';
}

$('#trips').addEventListener('input', e => {
  const { i, k } = e.target.dataset;
  if (i === undefined || !k) return;
  let v = e.target.value;
  if (k === 'origin' || k === 'destination') {
    v = v.toUpperCase();
    e.target.value = v;
    e.target.parentElement.querySelector('.hint').textContent = cityHint(v);
  }
  state.trips[i][k] = v;
  const hint = e.target.closest('section').querySelector(':scope > .hint');
  hint.textContent = `${combos(state.trips[i])} date combination${combos(state.trips[i]) === 1 ? '' : 's'}`;
  updateBudget();
});
$('#trips').addEventListener('change', e => { if (e.target.tagName === 'SELECT') { const { i, k } = e.target.dataset; state.trips[i][k] = e.target.value; } });
$('#trips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.del !== undefined) { state.trips.splice(Number(b.dataset.del), 1); render(); }
  if (b.dataset.set) { state.trips[b.dataset.i][b.dataset.set] = b.dataset.v; render(); }
});
$('#add').onclick = () => { state.trips.push(blank()); render(); };
$('#budget').oninput = updateBudget;

function status(msg, kind = '') { const s = $('#status'); s.textContent = msg; s.className = 'status ' + kind; }

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function save() {
  status('Saving…');
  const res = await post('/api/trips', { trips: state.trips, currency: $('#currency').value,
                                         max_searches_per_run: Number($('#budget').value) || 3 });
  status(`Saved ${state.trips.length} trip${state.trips.length === 1 ? '' : 's'} to trips.yaml. Commit and push it so the daily alert uses it.`, 'ok');
  return res;
}

$('#save').onclick = () => save().catch(e => status(e.message, 'err'));
$('#check').onclick = async () => {
  const btn = $('#check'); btn.disabled = true;
  try {
    await save();
    status('Searching flights…');
    const res = await post('/api/check', {});
    $('#result').innerHTML = res.message;   // HTML built server-side with escaped values
    $('#mock-pill').hidden = !res.mock;
    $('#result-card').hidden = false;
    status('Done.', 'ok');
  } catch (e) { status(e.message, 'err'); }
  btn.disabled = false;
};

fetch('/api/trips').then(r => r.json()).then(d => {
  state = d;
  $('#currency').value = d.currency;
  $('#budget').value = d.max_searches_per_run;
  if (!state.trips.length) state.trips.push(blank());
  render();
});
</script>
</body>
</html>
