# Your travel plan. Edit this file, commit, and the daily job picks it up.
#
# Dates
#   depart_dates / return_dates accept a list of dates, a range "YYYY-MM-DD..YYYY-MM-DD",
#   or a mix of both. Leave out return_dates (and trip_length_days) for a one-way trip.
#   Instead of return_dates you can give trip_length_days: [10, 14] (nights away).
#
# Multi-city
#   Use legs: instead of origin/destination/depart_dates. List each flight in order
#   (2 to 6 flights). Each flight's dates can be one date or a range. The price is the
#   total for the whole itinerary.
#
# Search budget
#   SerpApi's free plan allows 100 searches a month, about 3 a day. Each combination of
#   depart date x return date is one search. When a trip has more combinations than
#   the daily budget allows, the tracker checks a different slice each day and
#   cycles through all of them.

currency: USD
max_searches_per_run: 3      # keep at 3 or less on SerpApi's free plan
booking_link: deals          # deals: link to the exact flight on a new low or under target
                             # (1-3 extra searches); always: every day; off: search link only

trips:
  - name: "Example: India multi-city"     # replace with your real plan
    legs:
      - from: JFK                          # IATA airport code(s), e.g. JFK or JFK,EWR
        to: DEL
        dates: "2027-01-10..2027-01-11"    # one date or a flexible range
      - from: DEL
        to: BOM
        dates: "2027-01-18"
      - from: BOM
        to: JFK
        dates: "2027-01-28"
    adults: 1                            # travelers 18+ (or any age that pays an adult fare)
    # children_ages: [7, 1]              # each child's age on the travel date:
    #                                    # 12-17 pay adult fares, 2-11 child fares, under 2 are infants
    # infants: lap                       # lap (cheapest) or seat, for children under 2
    cabin: economy                       # economy | premium_economy | business | first
    max_stops: 1                         # 0 = nonstop only, 1, 2, or omit for any
    target_price: 1400                   # get an extra alert when it drops below this

  # A round trip looks like this:
  # - name: "Holiday"
  #   origin: JFK
  #   destination: DEL
  #   depart_dates: "2027-01-10..2027-01-12"
  #   trip_length_days: [14]             # or return_dates: "2027-01-24"
  #   adults: 2
  #   children_ages: [7, 4]
